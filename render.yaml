projects:
  - name: RotorWatch
    environments:
      - name: Production
        databases:
          - name: rotorwatch-db
            databaseName: drone_assistant
            user: rotorwatch
            plan: free
            region: singapore

        services:
          - type: web
            name: rotorwatch
            runtime: docker
            branch: main
            plan: free
            region: singapore
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /health
            autoDeployTrigger: commit
            envVars:
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: rotorwatch-db
                  property: connectionString
              - key: ADMIN_SECRET
                generateValue: true
              - key: TELEGRAM_BOT_TOKEN
                sync: false
              - key: TELEGRAM_WEBHOOK_SECRET
                generateValue: true
              - key: GEMINI_API_KEY
                sync: false
              - key: GEMINI_MODEL
                value: gemini-2.5-flash-lite
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: ANTHROPIC_MODEL
                value: claude-haiku-4-5
              - key: LLM_PROVIDER_TIMEOUT_SECONDS
                value: "8"
              - key: LLM_MAX_RETRIES
                value: "1"
              - key: LLM_PROVIDER_COOLDOWN_SECONDS
                value: "60"
              - key: MONITOR_INTERVAL
                value: daily
              - key: MONITOR_CONCURRENCY
                value: "5"
              - key: REQUEST_TIMEOUT
                value: "12"
              - key: REQUEST_MAX_RETRIES
                value: "1"
              - key: RATE_LIMIT_PER_MINUTE
                value: "60"
              - key: USER_AGENT
                value: RotorWatch/0.1 (+availability-monitor; contact=admin@example.invalid)
              - key: DEMO_MODE
                value: "false"

          - type: cron
            name: rotorwatch-daily-monitor
            runtime: python
            rootDir: backend
            branch: main
            region: singapore
            schedule: "30 1 * * *"
            buildCommand: pip install .
            startCommand: python -m app.jobs.monitor
            autoDeployTrigger: commit
            envVars:
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: rotorwatch-db
                  property: connectionString
              - key: ADMIN_SECRET
                generateValue: true
              - key: TELEGRAM_BOT_TOKEN
                fromService:
                  type: web
                  name: rotorwatch
                  envVarKey: TELEGRAM_BOT_TOKEN
              - key: TELEGRAM_WEBHOOK_SECRET
                fromService:
                  type: web
                  name: rotorwatch
                  envVarKey: TELEGRAM_WEBHOOK_SECRET
              - key: GEMINI_API_KEY
                fromService:
                  type: web
                  name: rotorwatch
                  envVarKey: GEMINI_API_KEY
              - key: GEMINI_MODEL
                value: gemini-2.5-flash-lite
              - key: OPENAI_API_KEY
                fromService:
                  type: web
                  name: rotorwatch
                  envVarKey: OPENAI_API_KEY
              - key: OPENAI_MODEL
                value: gpt-5-mini
              - key: ANTHROPIC_API_KEY
                fromService:
                  type: web
                  name: rotorwatch
                  envVarKey: ANTHROPIC_API_KEY
              - key: ANTHROPIC_MODEL
                value: claude-haiku-4-5
              - key: LLM_PROVIDER_TIMEOUT_SECONDS
                value: "8"
              - key: LLM_MAX_RETRIES
                value: "1"
              - key: LLM_PROVIDER_COOLDOWN_SECONDS
                value: "60"
              - key: MONITOR_CONCURRENCY
                value: "5"
              - key: REQUEST_TIMEOUT
                value: "12"
              - key: REQUEST_MAX_RETRIES
                value: "1"
              - key: USER_AGENT
                value: RotorWatch/0.1 (+availability-monitor; contact=admin@example.invalid)
              - key: DEMO_MODE
                value: "false"
