databases:
  - name: rotorwatch-db
    databaseName: drone_assistant
    user: rotorwatch
    plan: free

services:
  - type: web
    name: rotorwatch-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    startCommand: alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rotorwatch-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: rotorwatch-daily-monitor
    runtime: python
    rootDir: backend
    schedule: "30 1 * * *"
    buildCommand: pip install .
    startCommand: python -m app.jobs.monitor
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rotorwatch-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: rotorwatch-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          type: web
          name: rotorwatch-api
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: rotorwatch-api
          envVarKey: GEMINI_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: rotorwatch-api
          envVarKey: OPENAI_API_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: rotorwatch-api
          envVarKey: ANTHROPIC_API_KEY
