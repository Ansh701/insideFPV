services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drone_assistant
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
    ports:
      - "5432:5432"
    volumes:
      - rotorwatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  rotorwatch_postgres:
